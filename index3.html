<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pago GM Financial - PSE</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root {
    --gmac-teal: #15A48D;
    --gmac-dark: #181E28;
    --gmac-gray: #777;
    --gmac-light: #F8F8F8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    font-size: 15px;
    color: var(--gmac-dark);
    background: #fff;
    line-height: 1.5;
  }
  .header {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    color: #fff;
    padding: 20px 0;
    border-bottom: 4px solid var(--gmac-teal);
  }
  .header-inner {
    max-width: 1000px;
    margin: 0 auto;
    padding: 0 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
  }
  .header h1 { margin: 0; font-size: 22px; }
  .header .bienvenida { font-size: 14px; opacity: 0.9; }
  .header .bienvenida strong { color: var(--gmac-teal); }

  .container {
    max-width: 1000px;
    margin: 30px auto;
    padding: 0 20px;
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 30px;
  }
  @media (max-width: 768px) {
    .container { grid-template-columns: 1fr; }
  }

  .card {
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    padding: 25px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }
  .card h2 {
    margin-top: 0;
    color: var(--gmac-teal);
    font-size: 18px;
    border-bottom: 2px solid var(--gmac-teal);
    padding-bottom: 10px;
    margin-bottom: 20px;
  }

  .form-group { margin-bottom: 18px; }
  .form-group label {
    display: block;
    font-weight: 600;
    margin-bottom: 6px;
    color: #333;
    font-size: 14px;
  }
  .form-group input,
  .form-group select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 14px;
    font-family: inherit;
    transition: border-color 0.2s;
  }
  .form-group input:focus,
  .form-group select:focus {
    outline: none;
    border-color: var(--gmac-teal);
  }
  .form-group input[readonly] {
    background: #f5f5f5;
    color: #555;
    font-weight: 600;
  }

  .btn-pagar {
    width: 100%;
    padding: 14px;
    background: var(--gmac-teal);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s;
    margin-top: 10px;
  }
  .btn-pagar:hover:not(:disabled) { background: #12917c; }
  .btn-pagar:disabled {
    background: #b0b0b0;
    cursor: not-allowed;
  }

  .alert {
    padding: 12px 16px;
    border-radius: 6px;
    margin-bottom: 15px;
    font-size: 14px;
    display: none;
  }
  .alert.error {
    background: #fde8e8;
    color: #c0392b;
    border-left: 4px solid #c0392b;
  }
  .alert.success {
    background: #e8f8f5;
    color: #117a65;
    border-left: 4px solid #117a65;
  }
  .alert.info {
    background: #eaf2ff;
    color: #1e40af;
    border-left: 4px solid #1e40af;
  }
  .alert.show { display: block; }

  .resumen-item {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid #f0f0f0;
    font-size: 14px;
  }
  .resumen-item:last-child { border-bottom: none; }
  .resumen-item .label { color: var(--gmac-gray); }
  .resumen-item .value { font-weight: 600; color: #333; text-align: right; }
  .resumen-total {
    background: var(--gmac-light);
    padding: 15px;
    border-radius: 6px;
    margin-top: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .resumen-total .label { font-weight: 700; color: #333; }
  .resumen-total .value {
    font-size: 22px;
    font-weight: 800;
    color: var(--gmac-teal);
  }

  .spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 8px;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .footer {
    text-align: center;
    padding: 30px 20px;
    color: var(--gmac-gray);
    font-size: 12px;
    border-top: 1px solid #eee;
    margin-top: 40px;
  }
  .footer strong { color: var(--gmac-teal); }

  .seguridad {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--gmac-gray);
    margin-top: 15px;
  }
  .candado {
    display: inline-block;
    width: 14px;
    height: 11px;
    border: 2px solid var(--gmac-gray);
    border-radius: 2px;
    position: relative;
  }
  .candado::before {
    content: "";
    position: absolute;
    width: 8px;
    height: 6px;
    border: 2px solid var(--gmac-gray);
    border-bottom: none;
    border-radius: 6px 6px 0 0;
    top: -8px;
    left: 1px;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <h1>GM Financial</h1>
    <div class="bienvenida">
      Bienvenido(a): <strong id="bienvenida-nombre">Cargando...</strong>
    </div>
  </div>
</div>

<div class="container">

  <!-- COLUMNA IZQUIERDA: FORMULARIO PSE -->
  <div class="card">
    <h2>Pago PSE — Débito automático</h2>

    <div id="alert-box" class="alert"></div>

    <form id="form-pse" autocomplete="off">
      <div class="form-group">
        <label for="nombre_completo">Nombre completo *</label>
        <input type="text" id="nombre_completo" name="nombre_completo" required
               placeholder="Ej: Juan Pérez Gómez">
      </div>

      <div class="form-group">
        <label for="tipo_documento">Tipo de documento *</label>
        <select id="tipo_documento" name="tipo_documento" required>
          <option value="CC">Cédula de ciudadanía</option>
          <option value="CE">Cédula de extranjería</option>
          <option value="NIT">NIT</option>
          <option value="PPT">Permiso por protección temporal</option>
        </select>
      </div>

      <div class="form-group">
        <label for="numero_documento">Número de documento *</label>
        <input type="text" id="numero_documento" name="numero_documento" required
               inputmode="numeric" placeholder="Ej: 1020304050">
      </div>

      <div class="form-group">
        <label for="email">Correo electrónico *</label>
        <input type="email" id="email" name="email" required
               placeholder="tucorreo@ejemplo.com">
      </div>

      <div class="form-group">
        <label for="bank_code">Banco para PSE *</label>
        <select id="bank_code" name="bank_code" required>
          <option value="">Cargando bancos...</option>
        </select>
      </div>

      <div class="form-group">
        <label for="amount">Monto a pagar (COP) *</label>
        <input type="number" id="amount" name="amount" required
               step="1" min="1" placeholder="0">
      </div>

      <button type="submit" id="btn-pagar" class="btn-pagar" disabled>
        Pagar con PSE
      </button>

      <div class="seguridad">
        <span class="candado"></span>
        Conexión segura — Pago procesado por RappiPay PSE
      </div>
    </form>
  </div>

  <!-- COLUMNA DERECHA: RESUMEN -->
  <div class="card">
    <h2>Resumen de tu pago</h2>
    <div class="resumen-item">
      <span class="label">Documento</span>
      <span class="value" id="resumen-documento">—</span>
    </div>
    <div class="resumen-item">
      <span class="label">Placa</span>
      <span class="value" id="resumen-placa">—</span>
    </div>
    <div class="resumen-item">
      <span class="label">Factura</span>
      <span class="value" id="resumen-factura">—</span>
    </div>
    <div class="resumen-total">
      <span class="label">Total a pagar</span>
      <span class="value" id="resumen-total">$0</span>
    </div>
  </div>

</div>

<div class="footer">
  <strong>GM Financial</strong> — Pago procesado de forma segura vía PSE (RappiPay)<br>
  ¿Dudas? Contacta a tu asesor financiero.
</div>

<script>
(function () {
  'use strict';

  // ═══════════════════════════════════════════════════════════
  // CONFIG
  // ═══════════════════════════════════════════════════════════
  const API_BASE = window.location.origin;

  // ─── Parámetros de la URL (vienen del flujo GM) ──────────
  const params = new URLSearchParams(window.location.search);
  const PARAM_DOC    = params.get('documento') || '';
  const PARAM_PLACA  = params.get('placa')     || '';
  const PARAM_TOTAL  = params.get('total')     || '';
  const PARAM_NOMBRE = params.get('nombre')    || '';
  const PARAM_FACTURA= params.get('factura')   || '';

  // ═══════════════════════════════════════════════════════════
  // HELPERS
  // ═══════════════════════════════════════════════════════════
  const $ = (id) => document.getElementById(id);

  function mostrarAlerta(tipo, mensaje) {
    const box = $('alert-box');
    box.className = 'alert show ' + tipo;
    box.textContent = mensaje;
  }
  function ocultarAlerta() {
    $('alert-box').className = 'alert';
  }
  function formatearCOP(valor) {
    const n = Number(valor) || 0;
    return '$' + n.toLocaleString('es-CO');
  }

  // ═══════════════════════════════════════════════════════════
  // INICIALIZACIÓN: prellenar datos desde query params
  // ═══════════════════════════════════════════════════════════
  function prellenar() {
    $('bienvenida-nombre').textContent = PARAM_NOMBRE || 'Cliente GM Financial';

    if (PARAM_DOC)   $('numero_documento').value = PARAM_DOC;
    if (PARAM_NOMBRE) $('nombre_completo').value = PARAM_NOMBRE;

    if (PARAM_TOTAL) {
      const total = Number(String(PARAM_TOTAL).replace(/[^0-9.]/g, '')) || 0;
      $('amount').value = total;
    }

    $('resumen-documento').textContent = PARAM_DOC || '—';
    $('resumen-placa').textContent     = PARAM_PLACA || '—';
    $('resumen-factura').textContent   = PARAM_FACTURA || '—';
    $('resumen-total').textContent     = formatearCOP(PARAM_TOTAL || 0);
  }

  // Actualizar total del resumen en vivo
  $('amount').addEventListener('input', (e) => {
    $('resumen-total').textContent = formatearCOP(e.target.value);
  });

  // ═══════════════════════════════════════════════════════════
  // CARGAR BANCOS
  // ═══════════════════════════════════════════════════════════
  async function cargarBancos() {
    const sel = $('bank_code');
    try {
      const resp = await fetch(`${API_BASE}/pse/bancos`);
      const data = await resp.json();
      if (!data.ok || !Array.isArray(data.bancos)) {
        throw new Error(data.error || 'Respuesta inválida');
      }
      sel.innerHTML = '<option value="">— Selecciona tu banco —</option>';
      data.bancos.forEach((b) => {
        const opt = document.createElement('option');
        opt.value = b.code || b.bank_code || b.id;
        opt.textContent = b.name || b.bank_name || b.description;
        sel.appendChild(opt);
      });
      $('btn-pagar').disabled = false;
    } catch (err) {
      console.error('[bancos]', err);
      sel.innerHTML = '<option value="">Error al cargar bancos</option>';
      mostrarAlerta('error', 'No se pudieron cargar los bancos: ' + err.message);
    }
  }

  // ═══════════════════════════════════════════════════════════
  // SUBMIT DEL FORM → POST /pse/pagar
  // ═══════════════════════════════════════════════════════════
  $('form-pse').addEventListener('submit', async (e) => {
    e.preventDefault();
    ocultarAlerta();

    const nombre          = $('nombre_completo').value.trim();
    const tipoDocumento   = $('tipo_documento').value;
    const numeroDocumento = $('numero_documento').value.trim();
    const email           = $('email').value.trim();
    const bankCode        = $('bank_code').value;
    const amount          = Number($('amount').value);

    if (!nombre || !numeroDocumento || !email || !bankCode || !amount) {
      return mostrarAlerta('error', 'Por favor completa todos los campos.');
    }
    if (amount < 1000) {
      return mostrarAlerta('error', 'El monto mínimo es $1.000 COP.');
    }

    const bankName = $('bank_code').options[$('bank_code').selectedIndex].textContent;

    const btn = $('btn-pagar');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Procesando pago...';

    mostrarAlerta('info', 'Creando pago seguro con PSE...');

    try {
      const resp = await fetch(`${API_BASE}/pse/pagar`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          bank_code: bankCode,
          bank_name: bankName,
          document_type: tipoDocumento,
          document_number: numeroDocumento,
          amount: amount,
          email: email,
          full_name: nombre,
        }),
      });

      const data = await resp.json();

      if (!data.ok || !data.bank_url) {
        throw new Error(data.error || 'No se recibió URL del banco');
      }

      mostrarAlerta('success', '✅ Pago creado. Redirigiendo a tu banco...');
      console.log('[pagar] URL banco:', data.bank_url);

      // Redirigir al banco (PSE)
      setTimeout(() => {
        window.location.href = data.bank_url;
      }, 800);

    } catch (err) {
      console.error('[pagar]', err);
      mostrarAlerta('error', 'Error al procesar el pago: ' + err.message);
      btn.disabled = false;
      btn.innerHTML = 'Pagar con PSE';
    }
  });

  // ═══════════════════════════════════════════════════════════
  // BOOT
  // ═══════════════════════════════════════════════════════════
  prellenar();
  cargarBancos();

})();
</script>

</body>
</html>
